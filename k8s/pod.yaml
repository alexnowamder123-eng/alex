apiVersion: v1
kind: Pod
metadata:
  name: demo-api
  namespace: devsecops-lab
spec:
  containers:
    - name: api
      image: devsecops-demo:1.0
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
